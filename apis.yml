aid: sling-money
name: Sling Money
description: >-
  Sling Money — now operating as Morse, built by Avian Labs — is a consumer
  stablecoin-based global money-transfer app that lets people receive, hold,
  move, spend, send, and invest across 150+ countries and 40+ currencies from a
  single mobile app. Transfers settle on the Solana blockchain using regulated
  stablecoins (Paxos USDP, Circle EURC/USDC), and users can spend anywhere with a
  Visa card issued via Lead Bank. Avian Labs is MiCAR CASP-authorized by the AFM
  in the Netherlands (registration 41000005), a FinCEN-registered US Money
  Services Business (31000327638265), NMLS-registered (ID 2639252), and ISO/IEC
  27001:2022 certified. Morse is a consumer fintech product and does not
  currently publish a public developer API, SDKs, or API documentation; this
  profile captures its identity, legal, security, and compliance surface.
